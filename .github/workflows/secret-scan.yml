name: secret-scan
# Self-contained scanner. A public repository cannot call a reusable workflow kept in a
# private one, so this is an inline copy of the shared scanner body (release v4.0.1).
# It never runs repository code or honors repository scanner configuration, and it prints
# fixed statuses and counts only: no file names, values or findings reach the log.
# GitHub-hosted runners only.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
# A newer PR scan covers base..head, so superseded PR runs cancel. Each main push keeps its
# own group: it scans only the commits that push introduced and must never be skipped.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          d="$RUNNER_TEMP/gitleaks"; mkdir -p "$d"
          curl -sSfL -o "$d/g.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $d/g.tgz" | sha256sum -c -
          tar -xzf "$d/g.tgz" -C "$d" gitleaks
          echo "$d" >> "$GITHUB_PATH"
      - name: Scan introduced commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python3 -I -B - <<'PYSCAN'
          import os
          import re
          import select
          import time
          import subprocess
          import tempfile
          from pathlib import Path

          class Refusal(Exception):
              pass

          def main():
              # No caller-controlled scanner environment or config is inherited.
              env = {key: os.environ[key] for key in ("PATH", "SYSTEMROOT") if key in os.environ}
              env.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null",
                         GIT_NO_REPLACE_OBJECTS="1", GIT_TERMINAL_PROMPT="0")
              def run(args, *, cwd=None, limit=16 * 1024 * 1024):
                  # Bound plumbing output before allocation; never forward tool errors.
                  with subprocess.Popen(args, cwd=cwd, env=env, stdout=subprocess.PIPE,
                                        stderr=subprocess.DEVNULL) as process:
                      data = bytearray()
                      deadline = time.monotonic() + 60
                      try:
                          while True:
                              remaining = deadline - time.monotonic()
                              if remaining <= 0 or not select.select([process.stdout], [], [], remaining)[0]:
                                  raise Refusal("tool-timeout")
                              chunk = os.read(process.stdout.fileno(), min(65536, limit + 1 - len(data)))
                              if not chunk:
                                  break
                              data.extend(chunk)
                              if len(data) > limit:
                                  raise Refusal("tool-output-limit")
                          if process.wait(timeout=max(0.01, deadline - time.monotonic())):
                              raise Refusal("tool-error")
                          return bytes(data)
                      finally:
                          if process.poll() is None:
                              process.kill()
                              process.wait()

              def git(*args, limit=16 * 1024 * 1024):
                  return run(["git", "--no-replace-objects", "-c", "core.fsmonitor=false",
                              "-c", "core.hooksPath=/dev/null", *args], limit=limit)

              def commit(value):
                  if not re.fullmatch(r"[0-9a-f]{40}", value):
                      raise Refusal("invalid-endpoint")
                  if git("cat-file", "-t", value).strip() != b"commit":
                      raise Refusal("noncommit-endpoint")
                  return value

              head = commit(os.environ.get("HEAD_SHA", ""))
              event = os.environ.get("EVENT", "")
              if event in ("pull_request", "pull_request_target"):
                  base = commit(os.environ.get("PR_BASE", ""))
              elif event == "push":
                  base = os.environ.get("PUSH_BEFORE", "")
                  if base == "0" * 40:
                      base = None  # New branch: every reachable commit, never just HEAD.
                  else:
                      base = commit(base)
              else:
                  raise Refusal("unsupported-event")
              if git("rev-parse", "--is-shallow-repository").strip() != b"false":
                  raise Refusal("shallow-history")
              if base:
                  if event == "push":
                      git("merge-base", "--is-ancestor", base, head)  # Refuse force pushes.
                  else:
                      git("merge-base", base, head)  # PR base tips can advance independently.
              commits = git("rev-list", "--max-count=5001", f"{base}..{head}" if base else head).splitlines()
              if not commits or len(commits) > 5000:
                  raise Refusal("commit-coverage")
              blobs = set()
              deletions = 0
              for sha in commits:
                  # -m compares merges against EACH parent, catching resolution-only blobs.
                  entries = git("diff-tree", "--root", "-m", "--no-commit-id", "-r",
                                "--no-renames", "--no-ext-diff", "--no-textconv", "--raw", "-z", sha.decode()).split(b"\0")
                  for index in range(0, len(entries) - 1, 2):
                      fields = entries[index].split()
                      if len(fields) != 5 or not fields[0].startswith(b":"):
                          raise Refusal("tree-coverage")
                      mode, oid, change = fields[1], fields[3], fields[4]
                      if oid == b"0" * 40:
                          if change != b"D" or mode != b"000000":
                              raise Refusal("tree-coverage")
                          deletions += 1
                          continue  # Deletions introduce no content.
                      if mode not in (b"100644", b"100755", b"120000"):
                          raise Refusal("unsupported-object")
                      blobs.add(oid.decode())
                      if len(blobs) > 50000:
                          raise Refusal("blob-limit")
              if not blobs:
                  # Pass only a fully enumerated, deletion-only range: every entry
                  # was a verified deletion and nothing else was seen. Any added or
                  # modified blob is in `blobs` and is always scanned below.
                  if not deletions:
                      raise Refusal("zero-blob-coverage")
                  print(f"secret-scan status=clean commits={len(commits)} blobs=0")
                  return 0
              with tempfile.TemporaryDirectory(prefix="trusted-secret-scan-") as directory:
                  root = Path(directory)
                  # Trusted synthetic Git patches avoid MIME/path skips in dir/stdin.
                  # --text forces binary patch coverage; every file is a raw new blob.
                  target = root / "repository"
                  target.mkdir()
                  def synthetic_git(*args):
                      return run(["git", "-C", str(target), "-c", "core.hooksPath=/dev/null",
                                  "-c", "user.name=Scanner", "-c", "user.email=scanner@example.invalid",
                                  *args])
                  synthetic_git("init", "--quiet")
                  total = 0
                  for index, oid in enumerate(sorted(blobs)):
                      size = int(git("cat-file", "-s", oid))
                      total += size
                      if total > 100 * 1024 * 1024:
                          raise Refusal("byte-limit")
                      data = git("cat-file", "blob", oid, limit=size)
                      if len(data) != size:
                          raise Refusal("blob-coverage")
                      (target / str(index)).write_bytes(data)
                  if not total:
                      raise Refusal("zero-byte-coverage")
                  synthetic_git("add", "--all")
                  synthetic_git("commit", "--quiet", "--no-verify", "-m", "introduced blobs")
                  config = root / "default.toml"
                  config.write_text("[extend]\nuseDefault = true\n")
                  ignore = root / "empty.ignore"
                  ignore.write_text("")
                  if run(["gitleaks", "version"], cwd=root).strip() != b"8.30.1":
                      raise Refusal("scanner-version")
                  result = subprocess.run(
                      ["gitleaks", "git", str(target), "--config", str(config),
                       "--log-opts=--all --root --text --no-ext-diff --no-textconv --no-renames",
                       "--gitleaks-ignore-path", str(ignore), "--ignore-gitleaks-allow",
                       "--redact=100", "--no-banner", "--no-color"],
                      cwd=root, env=env, stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL, timeout=120)
                  status = {0: "clean", 1: "findings"}.get(result.returncode, "scanner-error")
                  print(f"secret-scan status={status} commits={len(commits)} blobs={len(blobs)}")
                  return 0 if result.returncode == 0 else 1

          try:
              raise SystemExit(main())
          except Refusal as error:
              print("secret-scan status=refused reason=" + str(error))
              raise SystemExit(1)
          except Exception:
              # No exception text, traceback, filename, tool output, or source context.
              print("secret-scan status=refused reason=internal-error")
              raise SystemExit(1)
          PYSCAN
