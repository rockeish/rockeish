name: secret-scan
# gitleaks over the commits each push/PR introduces (values redacted).
# Inline copy of rockeish/.github secret-scan.yml@v3: this is the only public
# repo, and a public repo cannot call a reusable workflow in a private one.
# GitHub-hosted only, per this repo's CLAUDE.md.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          d="$RUNNER_TEMP/gitleaks"; mkdir -p "$d"
          curl -sSfL -o "$d/g.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $d/g.tgz" | sha256sum -c -
          tar -xzf "$d/g.tgz" -C "$d" gitleaks
          echo "$d" >> "$GITHUB_PATH"
      - name: Scan introduced commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            range="${base}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          echo "gitleaks range: $range"
          gitleaks git . --redact --no-banner --verbose --log-opts="$range"
